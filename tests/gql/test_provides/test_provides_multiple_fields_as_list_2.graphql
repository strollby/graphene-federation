extend schema
	@link(url: "https://specs.apollo.dev/federation/v2.11", import: ["@extends", "@external", "@key", "@provides"])

type Query {
  inStockCount: InStockCount
}

type InStockCount  {
  product: Product! @provides(fields: "name weight")
  quantity: Int!
}

type Product  @key(fields: "sku") @extends {
  sku: String! @external
  name: String @external
  weight: Int @external
}

"""
A string-serialized scalar represents a set of fields that's passed to a federated directive, such as @key, @requires, or @provides
"""
scalar FieldSet

"""This string-serialized scalar represents a JWT scope"""
scalar federation__Scope

"""This string-serialized scalar represents an authorization policy."""
scalar federation__Policy

"""
Contains the name of a defined context and a selection of a field from the context's type
"""
scalar federation__ContextFieldValue